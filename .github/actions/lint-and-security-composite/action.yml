name: 'Lint and Security Scan Composite Action'
description: 'Runs Terraform linting and security scanning on PRs'

inputs:
  terraform_version:
    description: 'Terraform version to use'
    required: false
    default: '1.14.5'
  working_directory:
    description: 'Directory containing Terraform configuration'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Terraform Format Check
      shell: bash
      run: terraform fmt -check -recursive
      working-directory: ${{ inputs.working_directory }}

    - name: TFLint Setup
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: latest

    - name: Run TFLint
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        tflint --init
        tflint --recursive

    - name: Checkov Security Scan
      uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
      with:
        directory: ${{ inputs.working_directory }}
        framework: terraform
        soft_fail: false
