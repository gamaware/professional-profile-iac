name: 'Update Pre-commit Hooks Composite Action'
description: 'Updates pre-commit hook versions and creates a PR'

inputs:
  github_token:
    description: 'Fine-grained PAT for creating PRs that trigger CI'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'

    - name: Install pre-commit
      shell: bash
      run: pip install pre-commit

    - name: Update hooks
      shell: bash
      run: pre-commit autoupdate

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
      with:
        token: ${{ inputs.github_token }}
        commit-message: 'chore: update pre-commit hooks'
        title: 'chore: update pre-commit hook versions'
        body: |
          Automated update of pre-commit hook versions.

          Please review the changes and merge if tests pass.
        branch: chore/update-pre-commit-hooks
        delete-branch: true
