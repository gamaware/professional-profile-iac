version: 2
updates:
  # GitHub Actions: workflows plus the composite actions, which Dependabot
  # does not scan from the root directory alone.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
